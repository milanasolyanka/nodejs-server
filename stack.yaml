version: "3.9"

services:
  profiles:
    build: ./profiles
    ports:
      - "3001:3001"
    networks:
      - mynetwork
    deploy:
      placement:
        constraints:
          - node.hostname == nodejs-server-profiles

  about:
    build: ./about
    ports:
      - "3002:3002"
    networks:
      - mynetwork
    deploy:
      placement:
        constraints:
          - node.hostname == nodejs-server-about

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    networks:
      - mynetwork
    deploy:
      placement:
        constraints:
          - node.hostname == nodejs-server-manager

networks:
  mynetwork:
    external: true
